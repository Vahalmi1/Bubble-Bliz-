name: Build Release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "Using release signing keystore from GitHub Secrets."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release-upload.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No custom signing secrets configured; generating temporary CI keystore so release APK builds and installs cleanly."
            CI_PASS="ci_release_$(date +%s)"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/ci-upload-key.jks" \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$CI_PASS" \
              -keypass "$CI_PASS" \
              -dname "CN=Bitogin Tech, O=Bitogin Tech, C=US"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/ci-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare downloadable APK output
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/BubbleBlitz-release.apk
          ls -lh dist/BubbleBlitz-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BubbleBlitz-release-apk
          path: dist/BubbleBlitz-release.apk
          retention-days: 90

      - name: Publish Downloadable GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_PATH: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_PATH" == refs/tags/v* ]]; then
            TAG="$REF_NAME"
            TITLE="Bubble Blitz $TAG"
          else
            TAG="latest"
            TITLE="Bubble Blitz Latest Release"
          fi
          NOTES="Automated release APK build for commit $COMMIT_SHA."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/BubbleBlitz-release.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" dist/BubbleBlitz-release.apk --title "$TITLE" --notes "$NOTES"
          fi
