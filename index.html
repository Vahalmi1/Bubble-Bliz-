<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BUBBLE BLITZ – Bitogin Tech</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3a1fa8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#150b45;overscroll-behavior:none;font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:#fff;touch-action:manipulation}
button{font-family:inherit}
#app{position:fixed;inset:0;margin:auto;max-width:480px;overflow:hidden;background:#2a1a8f;box-shadow:0 0 60px #000a}
#bg{position:absolute;inset:0;width:100%;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:scale(1.04);transition:opacity .3s,transform .3s;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.screen.active{opacity:1;pointer-events:auto;transform:none}
.btn{position:relative;border:0;color:#fff;font-weight:900;cursor:pointer;border-radius:999px;padding:13px 20px;font-size:19px;text-shadow:0 2px 0 rgba(0,0,0,.35);overflow:hidden;transition:transform .08s;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(3px) scale(.98)}
.btn::after{content:"";position:absolute;left:8%;right:8%;top:4px;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.04));pointer-events:none}
.btn.green{background:linear-gradient(#7be34a,#2fa51d);box-shadow:0 5px 0 #1b6e12,0 9px 14px rgba(0,0,0,.35),inset 0 0 0 3px #c4f8a055}
.btn.yellow{background:linear-gradient(#ffd93a,#ff9d00);box-shadow:0 6px 0 #b86400,0 10px 16px rgba(0,0,0,.35),inset 0 0 0 3px #fff3a066}
.btn.purple{background:linear-gradient(#a45cff,#6a2bd6);box-shadow:0 5px 0 #3f1594,0 9px 14px rgba(0,0,0,.35),inset 0 0 0 3px #ffffff40}
.btn.red{background:linear-gradient(#ff6a6a,#d3202c);box-shadow:0 5px 0 #7d0f19,0 9px 14px rgba(0,0,0,.35),inset 0 0 0 3px #ffffff40}
.btn.blue{background:linear-gradient(#4fa3ff,#1659d8);box-shadow:0 5px 0 #0c2f8a,0 9px 14px rgba(0,0,0,.35),inset 0 0 0 3px #ffffff40}
.btn.big{font-size:28px;padding:15px 24px}
.btn.small{font-size:15px;padding:10px 16px;min-height:44px}
.btn[disabled]{filter:grayscale(.8) brightness(.8);pointer-events:none}
.circ{position:relative;width:48px;height:48px;border-radius:50%;border:0;color:#fff;font-size:22px;background:radial-gradient(circle at 35% 25%,#b88cff,#6a2fe0 60%,#3d17a0);box-shadow:0 4px 0 #2a0f78,0 6px 10px #0006,inset 0 0 0 2px #ffffff40;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.circ:active{transform:translateY(2px)}
.circ.sm{width:40px;height:40px;font-size:17px}
.row{display:flex;align-items:center;gap:12px;border:0;border-radius:22px;padding:10px 16px;color:#fff;text-align:left;position:relative;overflow:hidden;cursor:pointer;width:100%;font-size:16px;min-height:58px}
.row::after{content:"";position:absolute;left:4%;right:4%;top:3px;height:38%;border-radius:20px;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0));pointer-events:none}
.row:active{transform:translateY(3px)}
.row .ic{font-size:30px;width:44px;text-align:center;flex:none}
.row b{display:block;font-size:18px;text-shadow:0 2px 0 #0004}
.row small{display:block;opacity:.92;font-size:13px;line-height:1.2}
.row .chev{margin-left:auto;font-size:28px}
.row .badge{background:#ff3b3b;color:#fff;font-size:11px;font-weight:900;border-radius:999px;padding:2px 8px;margin-left:6px;box-shadow:0 2px 0 #900}
.row.purple{background:linear-gradient(#a45cff,#6a2bd6);box-shadow:0 5px 0 #3f1594,0 8px 12px #0005,inset 0 0 0 2px #ffffff40}
.row.green{background:linear-gradient(#69d93c,#2c9d1a);box-shadow:0 5px 0 #17660f,0 8px 12px #0005,inset 0 0 0 2px #ffffff40}
.row.blue{background:linear-gradient(#4fa3ff,#1659d8);box-shadow:0 5px 0 #0c2f8a,0 8px 12px #0005,inset 0 0 0 2px #ffffff40}
.row.gold{background:linear-gradient(#ffd93a,#ff9d00);box-shadow:0 5px 0 #b86400,0 8px 12px #0005,inset 0 0 0 2px #fff3a066}
.coin{display:inline-block;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7a8,#ffc400 55%,#b87800);border:2px solid #fff3a0;box-shadow:0 2px 0 #8a5800;vertical-align:middle;flex:none}
.toast{position:absolute;left:50%;top:76px;transform:translate(-50%,-20px);background:#1d0e62ee;border:2px solid #ffd93a;color:#fff;padding:10px 16px;border-radius:16px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:88%;text-align:center;box-shadow:0 8px 20px #0007}
.toast.show{opacity:1;transform:translate(-50%,0)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* splash */
#s-splash{align-items:center;justify-content:space-between;padding-top:calc(env(safe-area-inset-top) + 14px);padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
.logo{align-self:flex-start;display:flex;gap:10px;align-items:center;margin-left:16px;z-index:2}
.bico{width:46px;height:46px;border-radius:14px;background:linear-gradient(#7a52ff,#4326c9);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;border:3px solid #fff;box-shadow:0 3px 0 #2a1690}
.logo b{display:block;font-size:20px;text-shadow:0 2px 0 #0005}.logo small{opacity:.9;font-size:12px}
.title{margin:0;text-align:center;line-height:.9;z-index:2;transform:rotate(-3deg)}
.title span{display:block;font-size:min(20vw,96px);font-weight:900;-webkit-text-stroke:7px #3c1aa6;paint-order:stroke fill;letter-spacing:1px;filter:drop-shadow(0 6px 0 #26106e)}
.t1{background:linear-gradient(#fff56a,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent}
.t2{background:linear-gradient(#ffffff,#8fd0ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:min(24vw,112px)!important;margin-top:-2px}
.tag{background:linear-gradient(#7b3fe4,#4a1ba8);border:3px solid #ffd93a;border-radius:12px;padding:6px 18px;font-weight:900;font-size:min(4.8vw,21px);color:#ffe36a;transform:rotate(-3deg);box-shadow:0 4px 0 #2a0f78;z-index:2;text-shadow:0 2px 0 #0006}
.mascot{z-index:2;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.fb{position:absolute;border-radius:50%;bottom:-80px;opacity:.9;animation:rise linear infinite;z-index:1}
@keyframes rise{to{transform:translateY(-120vh) translateX(20px)}}

/* menu */
#s-menu{padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 10px);gap:9px;justify-content:space-between;overflow-y:auto}
.mtop{display:flex;align-items:center;gap:8px}
.avatar{width:52px;height:52px;border-radius:50%;border:3px solid #ffd93a;overflow:hidden;flex:none;background:#7bd1ff;box-shadow:0 3px 0 #0006;cursor:pointer}
.avatar svg{width:100%;height:100%}
.pinfo{flex:1;min-width:0;background:#2a1a8fcc;border-radius:14px;padding:5px 10px;cursor:pointer;border:1px solid #ffffff26}
.pinfo b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pinfo small{color:#ffd93a;font-size:12px}
.pbar{height:7px;background:#0005;border-radius:5px;margin-top:3px;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:linear-gradient(#ffe36a,#ffa600);border-radius:5px;transition:width .4s}
.coinpill{display:flex;align-items:center;gap:6px;background:linear-gradient(#6b3fd9,#3d1ca0);border:2px solid #ffffff55;border-radius:999px;padding:5px 6px;color:#fff;font-weight:900;font-size:15px;cursor:pointer;min-height:44px}
.coinpill em{font-style:normal;background:#38c82e;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:18px}
.dailybox{display:flex;align-items:center;gap:10px;background:linear-gradient(#5a2bb8,#2e1580);border:3px solid #a67cff;border-radius:22px;padding:8px 12px;cursor:pointer;box-shadow:0 5px 0 #1c0b5c,0 8px 14px #0006;position:relative}
.dailybox.ready{border-color:#ffd93a;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 #1c0b5c,0 0 22px 4px #ffd93a99}}
.dailybox b{font-size:20px;color:#ffe36a;display:block}.dailybox small{display:block;font-size:13px}
.timer{display:inline-block;margin-top:3px;background:#0006;border-radius:10px;padding:3px 10px;font-size:14px}
.bottomrow{display:flex;justify-content:space-around;margin-top:2px}
.bbtn{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:#fff;font-size:13px;font-weight:900;cursor:pointer;text-shadow:0 2px 0 #0008;min-width:64px}
.bbtn i{font-style:normal;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:radial-gradient(circle at 35% 25%,#b88cff,#5a25d0 65%,#2f0f88);box-shadow:0 4px 0 #1e0a66,0 7px 10px #0006,inset 0 0 0 3px #ffffff40;transition:transform .1s}
.bbtn:active i{transform:translateY(2px)}

/* map */
#s-map{background:#3a9d3f}
.maphead{display:flex;align-items:center;gap:10px;padding:8px 12px;z-index:3;position:relative}
.sign{flex:1;text-align:center;background:linear-gradient(#c98a45,#8a5222);border:3px solid #5d3513;border-radius:14px;padding:4px 8px;box-shadow:0 4px 0 #3a200a,0 7px 10px #0005;margin-right:46px}
.sign small{display:block;font-size:13px;color:#ffe9b8}.sign b{font-size:22px;text-shadow:0 2px 0 #0007}
#mapscroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;position:relative;scroll-behavior:smooth}
#mapinner{position:relative;background:linear-gradient(#a9e3ff 0,#bff0a0 300px,#7fd66b 600px,#4cbf4c 40%,#3aa84a)}
.deco{position:absolute;line-height:1;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.node{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:0;color:#fff;font-weight:900;font-size:22px;background:radial-gradient(circle at 35% 28%,#8fd0ff,#2a7cff 55%,#1646b8);box-shadow:0 5px 0 #0c2a80,0 0 0 4px #ffd54a,0 9px 10px rgba(0,0,0,.35);text-shadow:0 2px 0 #0006;cursor:pointer}
.node.cur{width:70px;height:70px;margin:-35px 0 0 -35px;font-size:28px;background:radial-gradient(circle at 35% 28%,#fff4a0,#ffc400 55%,#e07b00);box-shadow:0 6px 0 #a85200,0 0 0 5px #fff,0 0 24px 8px #ffe36a99;animation:pulse2 1.3s infinite}
@keyframes pulse2{50%{transform:scale(1.08)}}
.node.lock{background:radial-gradient(circle at 35% 28%,#d0d0d8,#8a8a99 55%,#5a5a6a);box-shadow:0 5px 0 #34343f,0 0 0 4px #aaa,0 9px 10px rgba(0,0,0,.3);color:#e6e6ee}
.node.mile:not(.cur){box-shadow:0 5px 0 #0c2a80,0 0 0 5px #ff9d00,0 9px 10px rgba(0,0,0,.35)}
.ns{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:16px;white-space:nowrap;letter-spacing:-1px;text-shadow:0 2px 0 #0006}
.ns .o{color:#ffd93a}.ns .f{color:#3a2a66}
.starpill{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(#6b3fd9,#3d1ca0);border:2px solid #ffffff66;border-radius:999px;padding:8px 16px;font-size:18px;font-weight:900;color:#ffd93a;box-shadow:0 4px 0 #1e0a66;z-index:3}
.jumppill{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(#ff9d00,#d06800);border:2px solid #fff3a0;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:900;color:#fff;box-shadow:0 4px 0 #7a3800;z-index:3;cursor:pointer}

/* game */
#s-game{padding-top:env(safe-area-inset-top)}
.hud{display:flex;align-items:center;gap:8px;padding:6px 10px 2px}
.hudbox{background:#1a0d5acc;border-radius:12px;padding:3px 10px;min-width:74px;text-align:center;border:2px solid #ffffff22}
.hudbox small{display:block;font-size:11px;opacity:.85}.hudbox b{font-size:19px}
.hstars{flex:1;text-align:center;font-size:28px;letter-spacing:2px;text-shadow:0 3px 0 #0006}
.hstars .o{color:#ffd93a}.hstars .f{color:#3b2a7a}
.objbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 12px 4px;font-size:13px}
.objbar b{background:#7b3fe4;border-radius:10px;padding:2px 9px;white-space:nowrap}
.objbar span{flex:1;text-align:center;background:#0004;border-radius:10px;padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.objbar em{font-style:normal;min-width:46px;text-align:right;color:#9fe8ff;white-space:nowrap}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 3px;vertical-align:-1px;border:1px solid #fff8}
#field{flex:1;position:relative;min-height:0;margin:0 4px}
#game{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.tray{display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(env(safe-area-inset-bottom) + 8px);height:auto}
.bst{position:relative;width:52px;height:52px;border-radius:50%;border:0;font-size:24px;background:radial-gradient(circle at 35% 25%,#7a52e8,#3a1d9a 70%);box-shadow:0 4px 0 #1e0a66,0 0 0 3px #b48cff,0 7px 9px #0006;color:#fff;cursor:pointer;transition:transform .12s}
.bst b{position:absolute;right:-6px;bottom:-4px;background:#ffd93a;color:#4a1a00;border-radius:10px;font-size:12px;padding:1px 6px;min-width:22px}
.bst.arm{box-shadow:0 4px 0 #8a5a00,0 0 0 4px #ffd93a,0 0 18px 6px #ffd93aaa;transform:translateY(-6px)}
.bst.none{filter:grayscale(.9) brightness(.7)}
.bst.sw{background:radial-gradient(circle at 35% 25%,#5aa6ff,#1b4fd0 70%);font-size:22px}

/* modals */
.modal{position:absolute;inset:0;background:rgba(10,4,40,.74);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;padding:14px}
.modal.show{opacity:1;pointer-events:auto}
.modal.l2{z-index:80}
.card{width:100%;max-height:92%;overflow-y:auto;background:linear-gradient(#5d33c4,#2c1580);border:3px solid #b48cff;border-radius:26px;padding:14px;box-shadow:0 8px 0 #1a0a5c,0 16px 30px #000a;transform:scale(.9);transition:transform .25s;position:relative}
.modal.show .card{transform:none}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mh h2{margin:0;font-size:24px;color:#ffe36a;text-shadow:0 3px 0 #0006}
.card p{margin:6px 0;font-size:14px;opacity:.95}
.card .btn{width:100%;margin-top:10px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:#00000033;border-radius:16px;padding:8px 10px}
.item .ic{font-size:28px;width:40px;text-align:center;flex:none}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font-size:15px}.item .tx small{opacity:.85;font-size:12px;display:block}
.item.lockd{opacity:.55;filter:grayscale(.6)}
.item .btn{width:auto;margin:0;padding:8px 14px;font-size:14px;min-height:42px}
.pb{height:6px;background:#0006;border-radius:4px;margin-top:4px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(#7be34a,#2fa51d)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{background:#00000040;border:2px solid #ffffff22;border-radius:14px;padding:8px 2px;text-align:center;font-size:12px}
.day i{font-style:normal;display:block;font-size:26px}.day b{display:block;font-size:12px;color:#ffe36a}
.day.now{border-color:#ffd93a;background:#ffd93a33;animation:pulse 1.2s infinite}
.day.got{opacity:.55}.day.got::after{content:"✔";display:block;color:#7be34a;font-size:14px}
.ribbon{background:linear-gradient(#8a4dff,#5320c0);border:3px solid #ffd93a;border-radius:14px;padding:6px 14px;font-size:26px;font-weight:900;color:#ffe36a;text-align:center;text-shadow:0 3px 0 #0007;margin:-4px -4px 8px}
.ribbon.red{background:linear-gradient(#ff5a5a,#c01a2a);border-color:#ffb3b3;color:#fff}
.vstars{display:flex;justify-content:center;gap:2px;margin-top:-34px;height:70px}
.vs{font-size:62px;color:#3b2a7a;text-shadow:0 4px 0 #0005;transform:scale(0)}
.vs.on{color:#ffd93a;animation:pop .5s forwards}
@keyframes pop{60%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1)}}
.vbody{text-align:center}
.vbody h3{margin:4px 0;font-size:21px}
.big-n{font-size:38px;font-weight:900;color:#ffe36a;text-shadow:0 3px 0 #0006;line-height:1.1}
.rew{display:flex;justify-content:center;gap:18px;margin:8px 0;font-size:34px}
.rew div{font-size:15px;font-weight:900}.rew div i{display:block;font-style:normal;font-size:34px}
.mascot-c{display:flex;justify-content:center;margin-top:-4px}
.wheelwrap{position:relative;width:260px;height:260px;margin:6px auto 4px}
.wheel{position:absolute;inset:0;border-radius:50%;border:6px solid #ffd93a;box-shadow:0 0 0 4px #7a3fe0,0 8px 18px #0008;transition:transform 4.4s cubic-bezier(.12,.7,.1,1)}
.wheel span{position:absolute;left:50%;top:50%;width:70px;margin-left:-35px;margin-top:-14px;text-align:center;font-size:13px;font-weight:900;text-shadow:0 2px 0 #0008;line-height:1.05}
.wheel span i{display:block;font-style:normal;font-size:24px}
.hub{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff4a0,#ffc400);border:4px solid #fff;display:flex;align-items:center;justify-content:center;color:#7a3a00;font-weight:900;font-size:14px;box-shadow:0 3px 0 #a85200;z-index:2}
.pointer{position:absolute;left:50%;top:-14px;margin-left:-16px;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid #ff3b3b;filter:drop-shadow(0 3px 0 #0006);z-index:3}
.sw{position:relative;display:inline-block;width:54px;height:30px;flex:none}.sw input{opacity:0;width:0;height:0}.sw i{position:absolute;inset:0;background:#0007;border-radius:20px;transition:.2s;cursor:pointer}.sw i::before{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked+i{background:#38c82e}.sw input:checked+i::before{transform:translateX(24px)}
.vol{width:110px;accent-color:#ffd93a;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;border:2px solid #ffffff33;background:#00000033;color:#fff;font-weight:900;border-radius:14px;padding:9px 8px;font-size:14px;cursor:pointer}
.tab.on{background:linear-gradient(#ffd93a,#ff9d00);color:#4a1a00;border-color:#fff3a0}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.statbox{background:#00000033;border-radius:14px;padding:9px 10px;text-align:center;border:1px solid #ffffff1a}
.statbox small{display:block;font-size:12px;opacity:.85}.statbox b{display:block;font-size:20px;color:#ffe36a;margin-top:2px}
.testtag{display:inline-block;background:#ff9d00;color:#3a1c00;border-radius:8px;padding:2px 10px;font-weight:900;font-size:13px}
.adbar{height:12px;background:#0006;border-radius:8px;overflow:hidden;margin:10px 0}.adbar i{display:block;height:100%;width:0;background:#7be34a;transition:width 3s linear}
.sep{height:2px;background:#ffffff1a;margin:10px 0}
.tiny{font-size:12px;opacity:.82;line-height:1.35}
</style>
</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>

  <section id="s-splash" class="screen">
    <div class="logo"><div class="bico">B</div><div><b>Bitogin Tech</b><small>Play • Enjoy • Win</small></div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <h1 class="title"><span class="t1">BUBBLE</span><span class="t2">BLITZ</span></h1>
      <div class="tag">Pop. Strategize. Conquer.</div>
    </div>
    <div class="mascot" id="splash-mascot"></div>
    <button class="btn green big" data-act="play" style="min-width:210px;z-index:2">▶ PLAY</button>
  </section>

  <section id="s-menu" class="screen">
    <div class="mtop">

function castle(x,cx,by,s,body,roof,win){
 const tw=(px,w,h,rh)=>{x.fillStyle=body;x.fillRect(px-w/2,by-h,w,h);x.fillStyle=roof;x.beginPath();x.moveTo(px-w/2-4*s,by-h);x.lineTo(px,by-h-rh);x.lineTo(px+w/2+4*s,by-h);x.fill();x.fillStyle=win;x.fillRect(px-3*s,by-h+12*s,6*s,10*s)};
 x.fillStyle=body;x.fillRect(cx-34*s,by-60*s,68*s,60*s);
 tw(cx-34*s,22*s,100*s,40*s);tw(cx+34*s,22*s,100*s,40*s);tw(cx,26*s,130*s,50*s);
 x.fillStyle=win;x.fillRect(cx-16*s,by-40*s,6*s,10*s);x.fillRect(cx+10*s,by-40*s,6*s,10*s)}

function drawScene(w,h,mode){
 const x=BX,night=mode==='night';
 let g=x.createLinearGradient(0,0,0,h);
 if(night){g.addColorStop(0,'#150a52');g.addColorStop(.5,'#3a1a85');g.addColorStop(1,'#6b2fa8')}
 else{g.addColorStop(0,'#2a2fd8');g.addColorStop(.35,'#4f7dff');g.addColorStop(.7,'#93c4ff');g.addColorStop(1,'#d8b4ff')}
 x.fillStyle=g;x.fillRect(0,0,w,h);
 const rnd=mulberry(night?7:3);
 if(night){for(let i=0;i<70;i++){x.fillStyle='rgba(255,255,255,'+(.3+rnd()*.6)+')';x.beginPath();x.arc(rnd()*w,rnd()*h*.7,rnd()*1.6+.4,0,7);x.fill()}}
 else{for(let i=0;i<6;i++)cloud(x,rnd()*w,h*(.06+rnd()*.4),.8+rnd()*.7,.55+rnd()*.3)}
 const hy=h*.7;
 x.fillStyle=night?'#2a2a78':'#8fe0a0';x.beginPath();x.moveTo(0,hy);x.bezierCurveTo(w*.3,hy-70,w*.6,hy+20,w,hy-50);x.lineTo(w,h);x.lineTo(0,h);x.fill();
 const s=Math.min(1.3,w/340);
 castle(x,w*.14,hy+10,s,night?'#4a2f94':'#e1d3ff',night?'#2a1a66':'#7b3fe4',night?'#ffd93a':'#7b3fe4');
 castle(x,w*.86,hy-14,s*.8,night?'#4a2f94':'#e1d3ff',night?'#2a1a66':'#7b3fe4',night?'#ffd93a':'#7b3fe4');
 let g2=x.createLinearGradient(0,hy,0,h);
 if(night){g2.addColorStop(0,'#1f5a45');g2.addColorStop(1,'#0f2f2c')}else{g2.addColorStop(0,'#5fd16a');g2.addColorStop(1,'#238f3a')}
 x.fillStyle=g2;x.beginPath();x.moveTo(0,hy+50);x.bezierCurveTo(w*.35,hy+10,w*.65,hy+90,w,hy+30);x.lineTo(w,h);x.lineTo(0,h);x.fill();
 for(let i=0;i<9;i++){const tx=rnd()*w,ty=hy+60+rnd()*(h-hy-60),sc=.8+rnd()*.8;tree(x,tx,ty,sc,night?'#1e6a4a':'#46c25a',night?'#134a35':'#2c9a44')}
 if(!night)for(let i=0;i<30;i++){x.fillStyle=['#ff6fb5','#ffe36a','#fff','#ff8a3d'][i%4];x.beginPath();x.arc(rnd()*w,hy+50+rnd()*(h-hy-50),2.5,0,7);x.fill()}}

    if(settled)return;settled=true;delete this.callbacks[reqId];

   try{window.BitoginNativeAds.showRewarded(this.appId,placement,reqId)}

 let L=genLevel(0,base);
 if(t===0){L.obj={type:'pop',target:20};L.shots=15}

/* =====================================================================
   GAME ENGINE
   ===================================================================== */
const cv=$('#game'),X=cv.getContext('2d');
let W=300,H=500,R=18,PAD=3,gx=0,gy=6,RH=31,SX=150,SY=450,DY=380,DROW=10,DPR=1,SP={};
const LOW=(navigator.hardwareConcurrency||4)<=4||(navigator.deviceMemory||4)<=2;
let G=null,paused=false,lastShotAt=0;
const cellX=(r,c)=>gx+R+c*2*R+(((r+G.par)&1)?R:0);
const cellY=r=>gy+R+r*RH+G.shift;
const cell=(r,c)=>cellAt(G.grid,r,c);

function mk(fn){const D=2*R+2*PAD,c=document.createElement('canvas');c.width=c.height=Math.ceil(D*DPR);const x=c.getContext('2d');x.scale(DPR,DPR);x.translate(R+PAD,R+PAD);fn(x);return c}
function gloss(x){
 x.beginPath();x.arc(0,0,R*.8,.2*Math.PI,.8*Math.PI);x.strokeStyle='rgba(255,255,255,.28)';x.lineWidth=R*.12;x.stroke();
 x.beginPath();x.ellipse(-R*.33,-R*.42,R*.34,R*.2,-.6,0,7);x.fillStyle='rgba(255,255,255,.82)';x.fill();
 x.beginPath();x.arc(R*.4,R*.4,R*.09,0,7);x.fillStyle='rgba(255,255,255,.55)';x.fill()}
function body(x,col){
 const g=x.createRadialGradient(-R*.3,-R*.35,R*.1,0,0,R);g.addColorStop(0,col.a);g.addColorStop(.55,col.b);g.addColorStop(1,col.d);
 x.beginPath();x.arc(0,0,R-.5,0,7);x.fillStyle=g;x.fill();x.lineWidth=1.5;x.strokeStyle='rgba(255,255,255,.4)';x.stroke()}
function bombIcon(x,s){
 x.save();x.scale(s,s);const g=x.createRadialGradient(-R*.25,-R*.25,2,0,0,R*.8);g.addColorStop(0,'#777');g.addColorStop(1,'#111');
 x.beginPath();x.arc(0,R*.1,R*.62,0,7);x.fillStyle=g;x.fill();x.strokeStyle='#fff';x.lineWidth=1.5;x.stroke();
 x.beginPath();x.moveTo(R*.2,-R*.45);x.quadraticCurveTo(R*.5,-R*.8,R*.75,-R*.6);x.strokeStyle='#d8b070';x.lineWidth=3;x.stroke();
 x.beginPath();x.arc(R*.78,-R*.62,R*.17,0,7);x.fillStyle='#ffb300';x.fill();x.beginPath();x.arc(R*.78,-R*.62,R*.08,0,7);x.fillStyle='#fff';x.fill();
 x.beginPath();x.ellipse(-R*.22,-R*.2,R*.16,R*.1,-.6,0,7);x.fillStyle='rgba(255,255,255,.7)';x.fill();x.restore()}
function makeSprites(){
 SP={};
 COLORS.forEach((col,i)=>{
  SP['c'+i]=mk(x=>{body(x,col);gloss(x)});
  SP['b'+i]=mk(x=>{body(x,col);gloss(x);bombIcon(x,.62)})});
 SP.rainbow=mk(x=>{for(let i=0;i<6;i++){x.beginPath();x.moveTo(0,0);x.arc(0,0,R-.5,i*Math.PI/3,(i+1)*Math.PI/3);x.fillStyle=COLORS[i].b;x.fill()}
  const g=x.createRadialGradient(-R*.3,-R*.3,1,0,0,R);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(0,0,0,.18)');x.beginPath();x.arc(0,0,R-.5,0,7);x.fillStyle=g;x.fill();x.lineWidth=2;x.strokeStyle='#fff';x.stroke();gloss(x)});
 SP.bomb=mk(x=>{bombIcon(x,1.25);x.beginPath();x.arc(0,0,R-1,0,7);x.strokeStyle='#ffd93a';x.lineWidth=2;x.stroke()});
 SP.lightning=mk(x=>{body(x,{a:'#fff7a8',b:'#ffc400',d:'#c27a00'});gloss(x);
  const p=[[.15,-.72],[-.38,.06],[-.02,.06],[-.15,.72],[.4,-.12],[.05,-.12]];x.beginPath();p.forEach((q,i)=>i?x.lineTo(q[0]*R,q[1]*R):x.moveTo(q[0]*R,q[1]*R));x.closePath();x.fillStyle='#fff';x.fill();x.strokeStyle='#e06a00';x.lineWidth=2;x.stroke()});
 SP.fire=mk(x=>{body(x,{a:'#ffd08a',b:'#ff5a00',d:'#8a1a00'});gloss(x);
  x.beginPath();x.moveTo(0,-R*.7);x.bezierCurveTo(R*.4,-R*.3,R*.55,R*.1,R*.28,R*.5);x.bezierCurveTo(R*.15,R*.68,-R*.15,R*.68,-R*.28,R*.5);x.bezierCurveTo(-R*.55,R*.1,-R*.2,-R*.25,0,-R*.7);x.fillStyle='#ffe36a';x.fill();
  x.beginPath();x.moveTo(0,-R*.2);x.bezierCurveTo(R*.2,R*.05,R*.25,R*.3,0,R*.5);x.bezierCurveTo(-R*.25,R*.3,-R*.2,R*.05,0,-R*.2);x.fillStyle='#fff';x.fill()});
 SP.stone=mk(x=>{const g=x.createRadialGradient(-R*.3,-R*.3,2,0,0,R);g.addColorStop(0,'#c9ccd6');g.addColorStop(.6,'#8a8fa0');g.addColorStop(1,'#444857');
  x.beginPath();x.arc(0,0,R-.5,0,7);x.fillStyle=g;x.fill();x.strokeStyle='#2a2d38';x.lineWidth=1.5;x.stroke();
  x.strokeStyle='rgba(30,32,45,.6)';x.lineWidth=1.5;x.beginPath();x.moveTo(-R*.5,-R*.2);x.lineTo(-R*.1,0);x.lineTo(-R*.2,R*.5);x.moveTo(-R*.1,0);x.lineTo(R*.45,R*.15);x.stroke();
  x.beginPath();x.ellipse(-R*.33,-R*.42,R*.28,R*.15,-.6,0,7);x.fillStyle='rgba(255,255,255,.4)';x.fill()})}
function sprKey(d){return d.t==='stone'?'stone':(d.b?'b':'c')+d.c}
function spr(k,x,y,s){const im=SP[k];if(!im)return;s=s||1;const D=(2*R+2*PAD)*s;X.drawImage(im,x-D/2,y-D/2,D,D)}

function resize(){
 paintBg();
 const f=$('#field'),w=f.clientWidth,h=f.clientHeight,d=Math.min(window.devicePixelRatio||1,2);
 if(w>0&&h>0){
  DPR=d;cv.width=Math.round(w*d);cv.height=Math.round(h*d);W=w;H=h;
  R=Math.max(8,Math.floor(w/(2*COLS+1)*10)/10);gx=(W-(2*R*COLS+R))/2;gy=6;RH=R*1.732;
  SX=W/2;SY=H-R*2.7;DY=SY-R*3.6;DROW=Math.max(6,Math.floor((DY-gy-R)/RH));

function newState(L,n,daily){
 const bonus=(!daily&&S.bonusShots)?S.bonusShots:0;
 if(bonus){S.bonusShots=0;save()}
 return{n,daily,L,grid:L.grid.map(r=>r.map(x=>x?{c:x.c,t:x.t,b:x.b}:null)),par:0,shots:L.shots+bonus,shotsMax:L.shots+bonus,
  score:0,removed:0,colorCleared:0,combo:0,maxCombo:0,miss:0,freeze:0,cur:0,next:0,armed:null,usedBooster:false,
  state:'ready',proj:null,pops:[],falls:[],parts:[],texts:[],beams:[],sparks:[],shift:0,aim:Math.PI/2,aiming:false,cancelZone:false,swapTap:false,reloadT:0,t:0,
  ended:false,won:false,endReason:'',continues:0,doubled:false,lastCoins:0,sp:.6}}
function startLevel(n,opts){
 opts=opts||{};closeModal();closeModal(true);
 show('game');resize();
 const daily=!!opts.daily;
 const L=daily?dailyLevel():genLevel(n,{maxRows:Math.max(3,DROW-4)});
 G=newState(L,daily?0:n,daily);paused=false;
 const sn=S.session;
 if(!opts.fresh&&sn&&!!sn.daily===daily&&sn.n===G.n&&(!daily||sn.dk===today())){
  G.grid=sn.grid.map(row=>row.map(v=>v?{c:v[0],t:v[1]?'stone':'n',b:!!v[2]}:null));
  G.par=sn.par;G.shots=sn.shots;G.shotsMax=sn.shotsMax;G.score=sn.score;G.removed=sn.removed;G.colorCleared=sn.cc;
  G.combo=sn.combo;G.miss=sn.miss;G.freeze=sn.freeze;G.cur=sn.cur;G.next=sn.next;G.usedBooster=!!sn.ub;G.maxCombo=sn.pc||0;
  fixColors()}
 else{G.cur=randColor();G.next=randColor();S.stats.games++}
 G.texts.push({x:W/2,y:H*.45,s:daily?'Daily Challenge':'Level '+G.n,t:0,big:1});
 updateHUD();updateTray();saveSession();Snd.init()}
function saveSession(){
 if(!G||G.ended)return;
 S.session={n:G.n,daily:G.daily,dk:G.daily?today():'',grid:G.grid.map(row=>row.map(x=>x?[x.c,x.t==='stone'?1:0,x.b?1:0]:0)),par:G.par,shots:G.shots,shotsMax:G.shotsMax,score:G.score,removed:G.removed,cc:G.colorCleared,combo:G.combo,miss:G.miss,freeze:G.freeze,cur:G.cur,next:G.next,ub:G.usedBooster,pc:G.maxCombo};
 save()}
function presentColors(){const s=new Set();for(const row of G.grid)for(const x of row)if(x&&x.t!=='stone')s.add(x.c);return[...s]}
function randColor(){const p=presentColors(),a=p.length?p:G.L.pal;return a[Math.floor(Math.random()*a.length)]}
function fixColors(){const p=presentColors();if(!p.length)return;if(!p.includes(G.cur))G.cur=p[Math.floor(Math.random()*p.length)];if(!p.includes(G.next))G.next=p[Math.floor(Math.random()*p.length)]}
function trimGrid(){while(G.grid.length&&G.grid[G.grid.length-1].every(x=>!x))G.grid.pop()}

/* --- HUD --- */
function starsNow(){const r=G.shots/G.shotsMax;return r>=.45?3:r>=.25?2:1}
function updateHUD(){
 $('#g-score').textContent=fmt(G.score);$('#g-shots').textContent=G.shots;
 const st=starsNow();$('#g-stars').innerHTML=[1,2,3].map(i=>`<span class="${i<=st?'o':'f'}">★</span>`).join('');
 $('#g-lvl').textContent=G.daily?'Daily':'Level '+G.n;
 const o=G.L.obj;let t='';
 if(o.type==='clear'){let n=0;for(const r of G.grid)for(const x of r)if(x&&x.t!=='stone')n++;t='Clear all ('+n+' left)'}
 else if(o.type==='score')t='Score '+fmt(G.score)+' / '+fmt(o.target);
 else if(o.type==='color')t='Pop <i class="dot" style="background:'+COLORS[o.color].b+'"></i>'+COLORS[o.color].n+': '+Math.min(G.colorCleared,o.target)+' / '+o.target;
 else t='Pop: '+Math.min(G.removed,o.target)+' / '+o.target;
 $('#g-obj').innerHTML=t;
 $('#g-drop').textContent=G.freeze>0?'❄ '+G.freeze:(G.L.dropEvery?'⬇ '+(G.L.dropEvery-G.miss):'')}
function updateTray(){
 const t=$('#tray');
 t.innerHTML=BOOST.map(k=>`<button class="bst ${G&&G.armed===k?'arm':''} ${S.inv[k]<=0?'none':''}" data-b="${k}" title="${BINFO[k].n}">${BINFO[k].i}<b>x${S.inv[k]}</b></button>`).join('')+`<button class="bst sw" data-act="swap" title="Swap Bubble">🔄</button>`}
function useBooster(k){
 if(!G||G.state!=='ready'||G.ended||paused)return;
 if(G.L.nobooster){toast('No boosters in this challenge');return}
 if(S.inv[k]<=0){toast('None left – get more in the Shop!');return}
 if(k==='freeze'){

  G.texts.push({x:W/2,y:H*.4,s:'❄ Frozen!',t:0,big:1});save();updateTray();updateHUD();saveSession();checkAch();return}
 G.armed=G.armed===k?null:k;Snd.click();updateTray()}
function swapBubbles(){if(!G||G.state!=='ready'||G.armed)return;const t=G.cur;G.cur=G.next;G.next=t;G.reloadT=.15;Snd.tone(600,.06,'sine',.1,200)}

/* --- shooting --- */
function shoot(){
 const now=performance.now();
 if(!G||G.state!=='ready'||G.proj||G.ended||paused||G.shots<=0||now-lastShotAt<140)return;
 lastShotAt=now;
 const a=G.aim,SPD=R*52;let type='n',c=G.cur;
 if(G.armed){type=G.armed;S.inv[type]--;S.stats.boosters++;G.usedBooster=true;G.armed=null;updateTray();save()}
 else{G.cur=G.next;G.next=randColor()}
 G.proj={x:SX,y:SY,vx:Math.cos(a),vy:-Math.sin(a),spd:SPD,type,c,list:[],n:0,hitSet:new Set()};
 G.shots--;G.reloadT=.2;G.state='busy';updateHUD();
 if(type==='fire')Snd.fire();else Snd.shoot();
 vib(8)}
function findHit(x,y){
 const lim=(R*1.8)*(R*1.8),r0=Math.max(0,Math.floor((y-gy-G.shift)/RH)-2),r1=Math.min(G.grid.length-1,r0+5);
 let best=null,bd=1e9;
 for(let r=r0;r<=r1;r++)for(let c=0;c<COLS;c++){if(!G.grid[r][c])continue;const dx=cellX(r,c)-x,dy=cellY(r)-y,d=dx*dx+dy*dy;if(d<lim&&d<bd){bd=d;best={r,c}}}
 return best}
function stepProj(dt){
 const p=G.proj,lx=gx+R,rx=W-gx-R;let rem=p.spd*dt;
 while(rem>0&&G.proj){
  const st=Math.min(rem,R*.4);rem-=st;p.x+=p.vx*st;p.y+=p.vy*st;
  if(p.x<lx){p.x=lx;p.vx=Math.abs(p.vx);Snd.bounce()}else if(p.x>rx){p.x=rx;p.vx=-Math.abs(p.vx);Snd.bounce()}
  if(p.type==='fire'&&!LOW&&Math.random()<.6)G.parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*R*4,vy:R*3,life:.4,m:.4,col:'#ffb300',s:R*.22});
  if(p.y<=gy+R){p.y=gy+R;landProj(null);return}
  const h=findHit(p.x,p.y);
  if(h){
   if(p.type==='fire'){
    const key=h.r*COLS+h.c;
    if(!p.hitSet.has(key)){p.hitSet.add(key);const rm=popGroup([[h.r,h.c]]);p.list.push(...rm);p.n++;if(p.n>=6){G.proj=null;finishShot(p.list);return}}
    continue}
   landProj(h);return}}}
function landProj(h){
 const p=G.proj;G.proj=null;
 if(p.type==='lightning'){
  G.beams.push({x:p.x,t:0});Snd.zap();vib(40);
  const l=[];for(let r=0;r<G.grid.length;r++)for(let c=0;c<COLS;c++)if(G.grid[r][c]&&Math.abs(cellX(r,c)-p.x)<R*1.08)l.push([r,c]);
  finishShot(popGroup(l));return}
 if(p.type==='bomb'){
  boomFx(p.x,p.y,R*3.2);const l=[],lim=(R*3.2)*(R*3.2);
  for(let r=0;r<G.grid.length;r++)for(let c=0;c<COLS;c++)if(G.grid[r][c]){const dx=cellX(r,c)-p.x,dy=cellY(r)-p.y;if(dx*dx+dy*dy<=lim)l.push([r,c])}
  finishShot(popGroup(l));return}
 if(p.type==='fire'){finishShot(p.list);return}
 let pos=h?bestCell(h,p.x,p.y):topCell(p.x);
 if(!pos)pos=nearestEmpty(p.x,p.y);
 const[r,c]=pos;while(G.grid.length<=r)G.grid.push(new Array(COLS).fill(null));
 if(p.type==='rainbow'){
  Snd.rainbow();
  const seen=new Set([[r,c].join(',')]),toPop=[[r,c]],adjCols=new Set();
  for(const[rr,cc]of adj(r,c,G.par)){const q=cell(rr,cc);if(q&&q.t!=='stone')adjCols.add(q.c)}
  let best=null,bs=0;
  for(const k of adjCols){
   G.grid[r][c]={c:k,t:'n',b:false};
   const cl=cluster(r,c);
   if(cl.length>=3){for(const[ar,ac]of cl){const key=ar+','+ac;if(!seen.has(key)){seen.add(key);toPop.push([ar,ac])}}}
   if(cl.length>bs){bs=cl.length;best=k}}
  if(toPop.length===1&&best!==null){
   G.grid[r][c]={c:best,t:'n',b:false};
   for(const[ar,ac]of cluster(r,c)){const key=ar+','+ac;if(!seen.has(key)){seen.add(key);toPop.push([ar,ac])}}}
  if(toPop.length>1){G.grid[r][c]={c:best??0,t:'n',b:false};finishShot(popGroup(toPop));return}
  const fallback=presentColors();
  G.grid[r][c]={c:fallback.length?fallback[0]:0,t:'n',b:false};
  Snd.stick();finishShot([]);return}
 G.grid[r][c]={c:p.c,t:'n',b:false};Snd.stick();
 const cl=cluster(r,c);
 finishShot(cl.length>=3?popGroup(cl):[])}
function bestCell(h,x,y){
 let best=null,bd=1e9;
 for(const[r,c]of adj(h.r,h.c,G.par)){if(r<0||c<0||c>=COLS||cell(r,c))continue;const dx=cellX(r,c)-x,dy=cellY(r)-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=[r,c]}}
 return best}
function topCell(x){let best=null,bd=1e9;for(let c=0;c<COLS;c++){if(cell(0,c))continue;const d=Math.abs(cellX(0,c)-x);if(d<bd){bd=d;best=[0,c]}}return best}
function nearestEmpty(x,y){
 let best=[0,0],bd=1e9;
 for(let r=0;r<=G.grid.length;r++)for(let c=0;c<COLS;c++){if(cell(r,c))continue;
  let ok=r===0;if(!ok)for(const[rr,cc]of adj(r,c,G.par))if(cell(rr,cc)){ok=true;break}
  if(!ok)continue;const dx=cellX(r,c)-x,dy=cellY(r)-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=[r,c]}}
 return best}
function cluster(r,c){
 const t=cell(r,c);if(!t||t.t==='stone')return[];
 const seen=new Set([r*COLS+c]),q=[[r,c]],out=[];
 while(q.length){const[a,b]=q.pop();out.push([a,b]);for(const[rr,cc]of adj(a,b,G.par)){const n=cell(rr,cc);if(!n||n.t==='stone'||n.c!==t.c)continue;const k=rr*COLS+cc;if(seen.has(k))continue;seen.add(k);q.push([rr,cc])}}
 return out}
function removeCell(r,c,kind,delay){

function update(dt){

 if(G.reloadT>0)G.reloadT=Math.max(0,G.reloadT-dt);
 if(G.shift){G.shift+=(-G.shift)*Math.min(1,dt*9);if(Math.abs(G.shift)<.3)G.shift=0}
 if(G.proj)stepProj(dt);
 for(let i=G.pops.length-1;i>=0;i--){const p=G.pops[i];if(p.delay>0){p.delay-=dt;continue}if(!p.b){p.b=1;burst(p.x,p.y,p.col,LOW?3:6)}p.t+=dt;if(p.t>.2)G.pops.splice(i,1)}
 for(let i=G.falls.length-1;i>=0;i--){const f=G.falls[i];if(f.delay>0){f.delay-=dt;continue}f.vy+=R*95*dt;f.y+=f.vy*dt;f.x+=f.vx*dt;if(f.y>H+R*2)G.falls.splice(i,1)}
 for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.life-=dt;if(p.life<=0){G.parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=R*30*dt}

 for(let i=G.beams.length-1;i>=0;i--){const b=G.beams[i];b.t+=dt;if(b.t>.45)G.beams.splice(i,1)}
 G.sp-=dt;if((G.sp<=0&&!LOW)||(G.sp<=0&&Math.random()<.5)){G.sp=.5+Math.random()*.6;const r=Math.floor(Math.random()*G.grid.length),c=Math.floor(Math.random()*COLS);if(cell(r,c))G.sparks.push({x:cellX(r,c)-R*.3,y:cellY(r)-R*.4,t:0})}
 for(let i=G.sparks.length-1;i>=0;i--){G.sparks[i].t+=dt;if(G.sparks[i].t>.5)G.sparks.splice(i,1)}}
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function trajectory(){
 const lx=gx+R,rx=W-gx-R;
 let x=SX,y=SY,vx=Math.cos(G.aim),vy=-Math.sin(G.aim),b=0;const pts=[],st=R*.4;
 for(let i=0;i<360;i++){x+=vx*st;y+=vy*st;
  if(x<lx){x=lx;vx=-vx;b++}else if(x>rx){x=rx;vx=-vx;b++}
  if(y<=gy+R){pts.push([x,gy+R]);break}
  if(findHit(x,y)){pts.push([x,y]);break}
  if(i%3===0&&i>3)pts.push([x,y]);
  if(b>4)break}

/* --- input (touch + mouse aiming) --- */
function pt(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*(W/b.width),y:(e.clientY-b.top)*(H/b.height)}}
function aimTo(p){
 const dx=p.x-SX,dy=SY-p.y;let a=Math.atan2(dy,dx);
 if(dy<R*.4)a=dx>=0?.2:Math.PI-.2;
 G.aim=Math.min(Math.PI-.2,Math.max(.2,a))}
cv.addEventListener('pointerdown',e=>{e.preventDefault();Snd.init();if(!G||paused||G.ended)return;
 const p=pt(e);
 if(Math.hypot(p.x-SX,p.y-SY)<R*1.5||Math.hypot(p.x-(SX-R*3.7),p.y-(SY+R*.9))<R*1.3){G.swapTap=true;return}
 G.aiming=true;G.cancelZone=p.y>=SY-R*1.2;aimTo(p);try{cv.setPointerCapture(e.pointerId)}catch(x){}});
cv.addEventListener('pointermove',e=>{e.preventDefault();if(!G||paused||G.ended)return;
 const p=pt(e);
 if(G.aiming){G.cancelZone=p.y>=SY-R*1.2;aimTo(p);return}
 if(e.pointerType==='mouse'&&G.state==='ready'&&p.y<SY-R*1.2){G.cancelZone=false;aimTo(p)}});
cv.addEventListener('pointerup',e=>{e.preventDefault();if(!G)return;const p=pt(e);
 if(G.swapTap){G.swapTap=false;swapBubbles();return}
 if(!G.aiming)return;G.aiming=false;G.cancelZone=false;aimTo(p);if(p.y<SY-R*1.2)shoot()});
cv.addEventListener('pointercancel',()=>{if(G){G.aiming=false;G.cancelZone=false;G.swapTap=false}});
['touchstart','touchmove'].forEach(n=>cv.addEventListener(n,e=>e.preventDefault(),{passive:false}));

 for(let m=10;m<=MAXLV;m+=10){const x=nx(m)+(nx(m)<W0/2?64:-64),y=ny(m)-4;svg+=`<g transform="translate(${x-30} ${y-34})">${chestSVG(60).replace(/<svg[^>]*>/,'<g>').replace('</svg>','</g>')}</g>`}
 svg+='</svg>';
 let html=svg;
 const tr=['🌲','🌳','🌳','🌲','🌴'],fl=['🌸','🌼','🌷','🌺','🍄'];
 for(let i=0;i<150;i++){const y=rng()*(H0-60)+20,x=rng()*W0;if(Math.abs(x-pathX(y))<64)continue;if(rivers.some(k=>Math.abs(y-(ny(k)-GAP/2))<40))continue;
  html+=`<span class="deco" style="left:${x-16}px;top:${y-34}px;font-size:${28+Math.floor(rng()*14)}px">${tr[Math.floor(rng()*5)]}</span>`}
 for(let i=0;i<110;i++){const y=rng()*(H0-60)+20,x=rng()*W0;if(Math.abs(x-pathX(y))<44)continue;if(rivers.some(k=>Math.abs(y-(ny(k)-GAP/2))<34))continue;
  html+=`<span class="deco" style="left:${x}px;top:${y}px;font-size:${14+Math.floor(rng()*8)}px">${fl[Math.floor(rng()*5)]}</span>`}
 for(let i=0;i<14;i++){html+=`<span class="deco" style="left:${rng()*(W0-60)}px;top:${rng()*320+60}px;font-size:${44+Math.floor(rng()*24)}px">${i%3?'⛰️':'🏔️'}</span>`}
 html+=`<span class="deco" style="left:${W0/2-40}px;top:34px;font-size:80px">🏰</span><div class="deco" style="left:0;width:100%;top:128px;text-align:center;font-size:14px;color:#fff;text-shadow:0 2px 0 #0007">World 2 coming soon 🔒</div>`;
 for(let i=1;i<=MAXLV;i++){
  const st=S.stars[i]||0,isCur=i===S.unlocked&&!(S.unlocked===MAXLV&&st>0),lock=i>S.unlocked;
  const cls='node '+(isCur?'cur':lock?'lock':'')+(i%10===0?' mile':'');
  const sh=(!lock&&!isCur)?`<span class="ns">${[1,2,3].map(k=>`<span class="${k<=st?'o':'f'}">★</span>`).join('')}</span>`:'';
  html+=`<button class="${cls}" data-act="node" data-n="${i}" style="left:${nx(i)}px;top:${ny(i)}px">${i}${sh}</button>`}
 inner.innerHTML=html;
 $('#map-stars').textContent='★ '+starTotal()+'/'+MAXLV*3;
 $('#map-jump').textContent='📍 Level '+Math.min(S.unlocked,MAXLV);
 const cy=ny(Math.min(S.unlocked,MAXLV));sc.scrollTop=Math.max(0,cy-sc.clientHeight*.6)}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function playLevel(n){
 if(n>S.unlocked){toast('🔒 Complete level '+S.unlocked+' first');return}
 const resume=S.session&&!S.session.daily&&S.session.n===n;
 startLevel(n,{fresh:!resume})}
function doReset(){
 S=DEF();today();Store.flush();G=null;dcache=null;Snd.syncVol();closeModal();closeModal(true);show('menu');toast('Progress reset')}
const ACT={
 play(){Snd.init();show('menu')},
 home(){closeModal();closeModal(true);if(G&&!G.ended)saveSession();show('menu')},
 close(){closeModal()},
 continue(){playLevel(S.level)},
 levels(){show('map')},
 jumpcur(){const sc=$('#mapscroll'),inner=$('#mapinner'),H0=inner.clientHeight,GAP=104;const cy=H0-130-(Math.min(S.unlocked,MAXLV)-1)*GAP;sc.scrollTo({top:Math.max(0,cy-sc.clientHeight*.6),behavior:'smooth'})},
 node(el){playLevel(+el.dataset.n)},
 challenge(){openChallenge()},
 startdaily(){startLevel(0,{daily:true,fresh:!(S.session&&S.session.daily&&S.session.dk===today())})},
 ach(){openAch()},shop(){openShop()},spin(){openSpin()},board(){openBoard('board')},stats(){openBoard('stats')},
 tabboard(){openBoard('board')},tabstats(){openBoard('stats')},
 settings(){openSettings()},daily(){openDaily()},
 claimdaily(){claimDaily()},addaily(){watchRewardedAdForDailyBonus()},
 buy(el){buy(el.dataset.k)},adbooster(){watchRewardedAdForBooster()},
 dospin(){spinFree()},spinad(){spinAd()},
 rename(){const n=prompt('Player name',S.name);if(n&&n.trim()){S.name=n.trim().slice(0,12);save();updateMenu()}},
 pause(){if(!G||G.ended||paused)return;paused=true;
  openModal(head('Paused').replace('data-act="close"','data-act="resume"')+`<div class="list">
  <div class="item"><span class="tx"><b>Sound Effects</b></span><label class="sw"><input type="checkbox" data-set="sound" ${S.settings.sound?'checked':''}><i></i></label></div>
  <div class="item"><span class="tx"><b>SFX Volume</b></span><input class="vol" type="range" min="0" max="100" value="${S.settings.sfxVol??80}" data-vol="sfxVol"></div>
  <div class="item"><span class="tx"><b>Background Music</b></span><label class="sw"><input type="checkbox" data-set="music" ${S.settings.music?'checked':''}><i></i></label></div>
  <div class="item"><span class="tx"><b>Music Volume</b></span><input class="vol" type="range" min="0" max="100" value="${S.settings.musicVol??55}" data-vol="musicVol"></div>
  </div>
  <button class="btn green" data-act="resume">▶ RESUME</button><button class="btn blue" data-act="restart">↻ RESTART</button><button class="btn purple" data-act="home">⌂ HOME</button>`)},
 resume(){closeModal();paused=false},
 restart(){startLevel(G.n,{daily:G.daily,fresh:true})},
 retry(){startLevel(G.n,{daily:G.daily,fresh:true})},
 next(){if(G.daily||G.n>=MAXLV){closeModal();show('menu');return}startLevel(G.n+1,{fresh:true})},
 addouble(){watchRewardedAdForDoubleCoins()},adshots(){watchRewardedAdForExtraShots()},
 swap(){swapBubbles()},
 reset(){openModal(`<h2 style="margin-top:0;color:#ffe36a">Reset progress?</h2><p>This permanently deletes your levels, coins, boosters and achievements on this device.</p><button class="btn red" data-act="resetyes">Yes, reset everything</button><button class="btn purple" data-act="resetno">Cancel</button>`,true)},
 resetyes(){doReset()},resetno(){closeModal(true)},
 adok(){clearTimeout(adTimer);closeModal(true);const f=pendingAd;pendingAd=null;if(f)f()},
 adskip(){clearTimeout(adTimer);pendingAd=null;closeModal(true);toast('Ad closed – no reward')}};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-b]');if(b){Snd.init();useBooster(b.dataset.b);return}
 const a=e.target.closest('[data-act]');if(!a)return;
 Snd.init();Snd.click();const f=ACT[a.dataset.act];if(f)f(a,e)});
document.addEventListener('change',e=>{
 const k=e.target.dataset&&e.target.dataset.set;if(!k)return;
 S.settings[k]=e.target.checked;save();Snd.syncVol();if(k==='sound'&&e.target.checked)Snd.click();if(k==='testAds'&&$('#card .mh'))openSettings()});
document.addEventListener('input',e=>{
 const k=e.target.dataset&&e.target.dataset.vol;if(!k)return;
 S.settings[k]=+e.target.value;Snd.syncVol();save()});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){if(G&&!G.ended&&cur==='game'&&!paused)ACT.pause();Store.flush()}});
window.addEventListener('pagehide',()=>{if(G&&!G.ended)saveSession();Store.flush()});

/* ---------------- boot ---------------- */
function floatBubbles(){
 const el=$('#s-splash');
 for(let i=0;i<14;i++){const d=document.createElement('div'),s=26+Math.random()*50,c=COLORS[i%6];
  d.className='fb';d.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*92}%;background:radial-gradient(circle at 32% 28%,#fff 0,${c.a} 18%,${c.b} 60%,${c.d});box-shadow:inset -3px -4px 8px rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.3);animation-duration:${7+Math.random()*9}s;animation-delay:${-Math.random()*12}s`;
  el.appendChild(d)}}
function handleBack(){
 if($('#modal2').classList.contains('show')){closeModal(true);return true}
 if($('#modal').classList.contains('show')){if(cur==='game'&&paused){ACT.resume()}else{closeModal()}return true}
 if(cur==='game'){if(G&&!G.ended&&!paused){ACT.pause()}else{ACT.home()}return true}
 if(cur==='map'){show('menu');return true}
 if(cur==='menu'){show('splash');return true}
 return false}
(async function boot(){
 try{const mf={name:'BUBBLE BLITZ',short_name:'Bubble Blitz',display:'standalone',orientation:'portrait',start_url:'.',background_color:'#2a1a8f',theme_color:'#3a1fa8'};
  const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));document.head.appendChild(l)}catch(e){}
 await Store.open();
 const loaded=await Store.load();if(loaded)S=merge(DEF(),loaded);
 S.level=Math.min(MAXLV,Math.max(1,S.unlocked));today();
 $('#splash-mascot').innerHTML=mascot('happy',165);
 floatBubbles();resize();show('splash');requestAnimationFrame(loop);
 window.__bb={S:()=>S,G:()=>G,AdManager,Snd,back:handleBack,pos:(r,c)=>[cellX(r,c),cellY(r)],dim:()=>[W,H]};
})();
})();
</script>
